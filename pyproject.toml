[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suda-lang"
version = "0.4.0"
description = "A small Arabic-first programming language with a bytecode virtual machine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Suda Language Contributors" }]

[project.scripts]
suda = "suda.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
