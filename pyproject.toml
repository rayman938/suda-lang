[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suda-lang"
version = "0.6.0"
description = "An Arabic-first programming language and desktop learning prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Suda Language Contributors" }]

[project.optional-dependencies]
qt = ["PySide6-Essentials>=6.8"]
voice = ["pyttsx3>=2.90"]

[project.scripts]
suda = "suda.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
